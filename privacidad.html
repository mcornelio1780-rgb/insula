<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Política de privacidad · Insula</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E2A30">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{--abismo:#0E2A30;--laguna:#1FA88E;--lagunap:#0B6E5D;--niebla:#EEF2EE;--basalto:#15191B;--muted:#4B5D5F;--line:#CBD6D4}
*{box-sizing:border-box}
body{margin:0;background:var(--niebla);color:var(--basalto);font:400 17px/1.65 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--lagunap)}
:focus-visible{outline:3px solid var(--laguna);outline-offset:3px;border-radius:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:860px;margin:0 auto;padding:22px 20px}
header a.logo img{height:30px;display:block}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.langs button{font:600 13px/1 inherit;font-family:inherit;border:0;background:none;color:var(--muted);padding:7px 9px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--abismo);color:var(--niebla)}
main{max-width:860px;margin:0 auto;padding:24px 20px 72px}
h1{font:400 clamp(36px,6vw,58px)/1.05 "Newsreader",Georgia,serif;color:var(--abismo);margin:20px 0 10px;letter-spacing:-.015em}
.up{font-size:14px;color:var(--muted);margin:0 0 28px}
main p{max-width:68ch;margin:0 0 16px}
main b{color:var(--abismo)}
.ref{font-size:14px;color:var(--muted)}
.back{display:inline-block;margin-top:24px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px)}
footer{max-width:860px;margin:0 auto;padding:0 20px 40px;font-size:14px;color:var(--muted)}
</style>
</head>
<body class="pg-privacidad">
<header><a class="logo" href="./" aria-label="Insula"><img src="logo.svg" alt="Insula"></a>
<div class="langs" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="pt">PT</button><button data-l="fr">FR</button></div></header>
<main><div class="card"><h1 id="t"></h1><p class="up" id="up"></p><div id="body"></div><a class="back" id="back" href="./"></a></div></main>
<footer>© 2026 Insula · <a id="mail" href="#"></a></footer>
<script src="config.js"></script>
<script>
const D={"es": {"t": "Política de privacidad", "p": ["Esta política explica qué datos personales recoge el sitio web de Insula y cómo los usamos.", "**1. Qué datos recogemos.** Solo los que nos das en el formulario de contacto: nombre, correo de trabajo, organización, país, sector y tu mensaje. No usamos cookies de publicidad ni rastreadores de terceros. El sitio puede guardar en tu navegador el idioma que elegiste.", "**2. Para qué los usamos.** Para responderte, agendar una demo y darte el servicio que contrates. No vendemos ni alquilamos tus datos.", "**3. Dónde se guardan.** En nuestro correo y en una hoja de cálculo de uso interno (Google Workspace). Los pagos los procesa Polar (polar.sh) como comerciante registrado; nunca vemos los datos de tu tarjeta.", "**4. Los documentos de tus clientes.** El software Insula se instala en tu equipo y funciona sin internet. Tus documentos y consultas no se envían a nosotros ni a terceros.", "**5. Cuánto tiempo.** Conservamos los datos de contacto mientras exista una relación comercial o hasta que nos pidas borrarlos.", "**6. Tus derechos.** Puedes pedir acceso, corrección, eliminación u oposición escribiendo a {email}. Respetamos la Ley 29733 (Perú), el RGPD (UE), la LGPD (Brasil) y las leyes aplicables en tu país.", "**7. Cambios.** Si cambiamos esta política, publicaremos la nueva versión en esta página."], "up": "Actualizado: 16 de noviembre de 2026", "back": "← Volver al inicio"}, "en": {"t": "Privacy policy", "p": ["This policy explains what personal data the Insula website collects and how we use it.", "**1. What we collect.** Only what you give us in the contact form: name, work email, organization, country, industry and your message. We don’t use advertising cookies or third-party trackers. The site may store your chosen language in your browser.", "**2. Why.** To reply, book a demo and provide the service you buy. We never sell or rent your data.", "**3. Where it’s stored.** In our email and an internal spreadsheet (Google Workspace). Payments are processed by Polar (polar.sh) as merchant of record; we never see your card details.", "**4. Your clients’ documents.** The Insula software is installed on your hardware and works offline. Your documents and queries are never sent to us or to third parties.", "**5. Retention.** We keep contact data while there is a business relationship or until you ask us to delete it.", "**6. Your rights.** You can request access, correction, deletion or objection by emailing {email}. We follow GDPR, CCPA, LGPD and applicable local laws.", "**7. Changes.** If we update this policy, we’ll publish the new version on this page."], "up": "Last updated: November 16, 2026", "back": "← Back to home"}, "pt": {"t": "Política de privacidade", "p": ["Esta política explica quais dados pessoais o site da Insula coleta e como os usamos.", "**1. O que coletamos.** Apenas o que você informa no formulário: nome, e-mail corporativo, organização, país, setor e sua mensagem. Não usamos cookies de publicidade nem rastreadores de terceiros. O site pode salvar no seu navegador o idioma escolhido.", "**2. Para quê.** Para responder, agendar uma demo e prestar o serviço contratado. Nunca vendemos nem alugamos seus dados.", "**3. Onde ficam.** No nosso e-mail e numa planilha interna (Google Workspace). Os pagamentos são processados pela Polar (polar.sh) como merchant of record; nunca vemos os dados do seu cartão.", "**4. Documentos dos seus clientes.** O software Insula é instalado no seu equipamento e funciona sem internet. Seus documentos e consultas nunca são enviados para nós nem para terceiros.", "**5. Prazo.** Mantemos os dados de contato enquanto houver relação comercial ou até você pedir a exclusão.", "**6. Seus direitos.** Você pode pedir acesso, correção, exclusão ou oposição escrevendo para {email}. Seguimos a LGPD, o RGPD e as leis aplicáveis.", "**7. Mudanças.** Se atualizarmos esta política, publicaremos a nova versão nesta página."], "up": "Atualizado em 16 de novembro de 2026", "back": "← Voltar ao início"}, "fr": {"t": "Politique de confidentialité", "p": ["Cette politique explique quelles données personnelles le site d’Insula collecte et comment nous les utilisons.", "**1. Ce que nous collectons.** Uniquement ce que vous saisissez dans le formulaire : nom, e-mail professionnel, organisation, pays, secteur et votre message. Aucun cookie publicitaire ni traceur tiers. Le site peut enregistrer la langue choisie dans votre navigateur.", "**2. Finalités.** Vous répondre, planifier une démo et fournir le service acheté. Nous ne vendons ni ne louons vos données.", "**3. Stockage.** Dans notre messagerie et un tableur interne (Google Workspace). Les paiements sont traités par Polar (polar.sh) en tant que marchand officiel ; nous ne voyons jamais vos données de carte.", "**4. Les documents de vos clients.** Le logiciel Insula est installé sur votre matériel et fonctionne hors ligne. Vos documents et requêtes ne nous sont jamais envoyés, ni à des tiers.", "**5. Conservation.** Nous conservons les coordonnées tant que dure la relation commerciale ou jusqu’à votre demande de suppression.", "**6. Vos droits.** Accès, rectification, effacement ou opposition : écrivez à {email}. Nous respectons le RGPD, la Loi 25 (Québec) et les lois applicables.", "**7. Modifications.** Toute mise à jour sera publiée sur cette page."], "up": "Mis à jour le 16 novembre 2026", "back": "← Retour à l’accueil"}};
const C=window.INSULA_CONFIG||{};const EMAIL=C.contactEmail||"manyosa@limly.io";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setLang(l){if(!D[l])l='es';const d=D[l];document.documentElement.lang=l;
 let ref='';try{const id=new URLSearchParams(location.search).get('checkout_id');if(id)ref='<br><span class="ref">'+(l==='en'?'Order':l==='fr'?'Commande':l==='pt'?'Pedido':'Pedido')+': '+esc(id)+'</span>'}catch(e){}
 document.getElementById('t').textContent=d.t;document.title=d.t+' · Insula';
 const up=document.getElementById('up');up.textContent=d.up;up.hidden=!d.up;
 document.getElementById('body').innerHTML=d.p.map(x=>'<p>'+esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace('{email}','<a href="mailto:'+esc(EMAIL)+'">'+esc(EMAIL)+'</a>').replace('{ref}',ref)+'</p>').join('');
 document.getElementById('back').textContent=d.back;
 document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 try{localStorage.setItem('insula-lang',l)}catch(e){}
 document.querySelectorAll('a[href="./"]').forEach(a=>a.href='./#'+l);
}
const m=document.getElementById('mail');m.href='mailto:'+EMAIL;m.textContent=EMAIL;
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
let s=null;try{s=new URLSearchParams(location.search).get('lang')}catch(e){}
if(!D[s]){try{s=localStorage.getItem('insula-lang')}catch(e){}}
if(!D[s]){const n=(navigator.language||'es').slice(0,2);s=D[n]?n:'es'}
setLang(s);
</script>
</body>
</html>
